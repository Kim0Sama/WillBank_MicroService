spring:
  application:
    name: client-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/willbank_client_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: client_service_user
    password: ClientService2024!
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: WillBankSecretKey2024VeryLongSecretKeyForJWTTokenGeneration123456789
  expiration: 86400000
